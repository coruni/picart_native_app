<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>底部导航图标预览 · PicArt</title>
<style>
  :root {
    --primary: #6680ff;
    --bg: #f8f9fd;
    --surface: #ffffff;
    --border: #eceff6;
    --text: #111827;
    --muted: #9aa1ae;
    --page: #f8f9fd;
    --radius: 22px;
  }
  html[data-theme="dark"] {
    --bg: #0c0f1d;
    --surface: #1b1d2a;
    --border: #262a3b;
    --text: #ededed;
    --muted: #8b93a7;
    --page: #080a14;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 24px 64px;
    background: var(--page);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    transition: background .25s ease, color .25s ease;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; gap: 16px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; }
  header p { margin: 0; font-size: 13px; color: var(--muted); }
  .switch {
    flex: none; display: flex; padding: 3px; gap: 2px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  }
  .switch button {
    border: 0; background: transparent; color: var(--muted); font: inherit;
    font-size: 12px; padding: 6px 12px; border-radius: 7px; cursor: pointer;
  }
  .switch button.on { background: var(--primary); color: #fff; }

  .demo {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 26px; padding: 18px; margin-bottom: 22px;
    transition: background .25s ease, border-color .25s ease;
  }
  .demo-label { font-size: 12px; color: var(--muted); margin: 0 0 14px 4px; }

  .tabbar {
    display: flex; align-items: center; justify-content: space-around;
    height: 64px; border-radius: 20px; background: var(--surface);
  }
  .tab {
    flex: 1; height: 52px; margin: 0 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    border: 0; background: transparent; border-radius: 14px; cursor: pointer;
    color: var(--muted); font: inherit; padding: 0;
    transition: background .18s ease;
  }
  .tab:active { transform: scale(.94); }
  .tab svg { --f: none; --s: var(--muted); --d: none; --ds: var(--muted); display: block; }
  .tab.active svg { --f: var(--primary); --s: var(--primary); --d: var(--surface); --ds: var(--surface); }
  .tab span { font-size: 11px; line-height: 1; }
  .tab.active span { color: var(--primary); }

  .sizes { display: grid; gap: 18px; }
  .size-row { display: flex; align-items: center; gap: 22px; }
  .size-tag { width: 44px; font-size: 12px; color: var(--muted); flex: none; }
  .size-cell {
    width: 56px; height: 56px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  }
  .size-cell svg { --f: var(--primary); --s: var(--primary); --d: var(--surface); --ds: var(--surface); }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.7; margin: 26px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>底部导航图标</h1>
      <p>圆润风格 · 未激活描边 / 激活实心填充</p>
    </div>
    <div class="switch">
      <button data-theme-btn="light" class="on">浅色</button>
      <button data-theme-btn="dark">深色</button>
    </div>
  </header>

  <div class="demo">
    <p class="demo-label">浅色标签栏 · 点击图标切换激活态</p>
    <div class="tabbar" id="tabbar-light"></div>
  </div>

  <div class="demo" style="background:#1b1d2a;border-color:#262a3b">
    <p class="demo-label" style="color:#8b93a7">深色标签栏 · 镂空色跟随背景</p>
    <div class="tabbar" id="tabbar-dark" style="--surface:#1b1d2a;--muted:#8b93a7;--border:#262a3b;background:#1b1d2a"></div>
  </div>

  <div class="demo">
    <p class="demo-label">不同尺寸下的激活态</p>
    <div class="sizes" id="sizes"></div>
  </div>

  <p class="hint">
    所有图标共用 24×24 视框、1.9 线宽、round 端点。<br />
    激活态的内部结构（门、三点）用标签栏背景色挖空，因此深浅色都能正确显示。
  </p>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24">
      <path d="M3.5 11.35C3.5 10.6 3.78 9.88 4.3 9.38L10.55 3.35C11.36 2.57 12.64 2.57 13.45 3.35L19.7 9.38C20.22 9.88 20.5 10.6 20.5 11.35V17.35C20.5 19.2 19 20.7 17.15 20.7H6.85C5 20.7 3.5 19.2 3.5 17.35Z" fill="var(--f)" stroke="var(--s)" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M9.35 20.7V17.15C9.35 15.7 10.5 14.55 12 14.55C13.5 14.55 14.65 15.7 14.65 17.15V20.7" fill="var(--d)" stroke="var(--ds)" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-circle" viewBox="0 0 24 24">
      <circle cx="15.3" cy="15.1" r="4.8" fill="var(--f)" stroke="var(--s)" stroke-width="2"/>
      <circle cx="9.3" cy="9.3" r="5.9" fill="var(--f)" stroke="var(--s)" stroke-width="2"/>
    </symbol>
    <symbol id="i-message" viewBox="0 0 24 24">
      <path d="M6.6 4.4H17.4C19.15 4.4 20.55 5.8 20.55 7.55V13.35C20.55 15.1 19.15 16.5 17.4 16.5H11.4L8 19.55C7.2 20.25 5.5 19.7 5.5 18.6V16.1C4.35 15.35 3.45 14.05 3.45 12.55V7.55C3.45 5.8 4.85 4.4 6.6 4.4Z" fill="var(--f)" stroke="var(--s)" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="8.15" cy="10.45" r="1.4" fill="var(--d)"/>
      <circle cx="12" cy="10.45" r="1.4" fill="var(--d)"/>
      <circle cx="15.85" cy="10.45" r="1.4" fill="var(--d)"/>
    </symbol>
    <symbol id="i-profile" viewBox="0 0 24 24">
      <path d="M4.5 20.8C4.5 17 7.85 14.5 12 14.5C16.15 14.5 19.5 17 19.5 20.8" fill="var(--f)" stroke="var(--s)" stroke-width="1.9" stroke-linecap="round"/>
      <circle cx="12" cy="8.15" r="3.95" fill="var(--f)" stroke="var(--s)" stroke-width="1.9"/>
    </symbol>
  </defs>
</svg>

<script>
  const ICONS = [
    { key: 'home', label: '首页' },
    { key: 'circle', label: '圈子' },
    { key: 'message', label: '消息' },
    { key: 'profile', label: '我的' },
  ];

  const svg = (key, size) =>
    `<svg width="${size}" height="${size}" aria-hidden="true"><use href="#i-${key}"/></svg>`;

  const mountTabbar = (el, activeIndex, tint) => {
    el.innerHTML = ICONS.map((icon, i) => `
      <button class="tab ${i === activeIndex ? 'active' : ''}" data-index="${i}" ${tint ? `style="color:${tint}"` : ''}>
        ${svg(icon.key, 25)}
        <span>${icon.label}</span>
      </button>`).join('');
    el.querySelectorAll('.tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        el.querySelectorAll('.tab').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  };

  const light = document.getElementById('tabbar-light');
  const dark = document.getElementById('tabbar-dark');
  mountTabbar(light, 1, '');
  mountTabbar(dark, 1, '#8b93a7');

  const sizes = document.getElementById('sizes');
  sizes.innerHTML = [24, 28, 32, 40].map((size) => `
    <div class="size-row">
      <span class="size-tag">${size}px</span>
      ${ICONS.map((icon) => `<div class="size-cell">${svg(icon.key, size)}</div>`).join('')}
    </div>`).join('');

  document.querySelectorAll('[data-theme-btn]').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.documentElement.dataset.theme = btn.dataset.themeBtn;
      document.querySelectorAll('[data-theme-btn]').forEach((b) => b.classList.toggle('on', b === btn));
    });
  });
</script>
</body>
</html>
